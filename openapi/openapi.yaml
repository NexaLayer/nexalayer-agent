openapi: 3.0.3
info:
  title: NexaLayer Agent API
  version: 1.0.0
  description: Session-based Network Execution Layer API for AI agents and browser automation.
servers:
  - url: https://api.nexalayer.net/v1
security:
  - ApiKey: []
paths:
  /public/products:
    get:
      summary: Read current openAgent product prices without an API key.
      security: []
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [all, dynamic, static], default: all } }
        - { in: query, name: country, schema: { type: string } }
        - { in: query, name: in_stock, schema: { type: boolean, default: true } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200":
          description: Current product prices owned by reseller openAgent (1474), cached for at most 60 seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /account/request-api-key:
    post:
      summary: Request an API Key by email.
      security: []
      parameters:
        - in: header
          name: X-Client-Installation-Id
          required: false
          schema: { type: string, format: uuid }
          description: Stable first-party installation identifier used only for trial abuse prevention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                referral_code: { type: string }
      responses:
        "200":
          description: API Key email accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestApiKeyResponse"
  /account/register:
    post:
      summary: Register an Agent account and receive API credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                contact_email: { type: string }
                referral_code: { type: string }
      responses:
        "201":
          description: Registered. Check backend_ready before creating sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /account/info:
    get:
      summary: Get Agent account state.
      responses:
        "200":
          description: Account info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      api_key_prefix: { type: string, example: nx_abcd…wxyz }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/budget:
    get:
      summary: Read API-Key and daily spend guardrails.
      responses:
        "200": { description: Budget policy and current spend. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Configure spend limits, alerts, and manual pause state.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetRequest"
      responses:
        "200": { description: Updated budget policy. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/usage-alerts:
    get:
      summary: Read crossed budget thresholds and pause state.
      responses:
        "200": { description: Usage alerts. }
  /products:
    get:
      summary: List dynamic and static proxy products.
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [all, dynamic, static] }
        - { in: query, name: country, schema: { type: string } }
        - { in: query, name: in_stock, schema: { type: boolean, default: true } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200":
          description: Product list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sessions:
    post:
      summary: Create a dynamic or static proxy session asynchronously.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "202":
          description: Session creation accepted. Poll GET /sessions/{session_id}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "402": { $ref: "#/components/responses/InsufficientBalance" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sessions/{session_id}:
    get:
      summary: Get session status, proxy config, health, and usage.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: include_credentials
          description: Set true to include proxy username, password, and full_url. Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Terminate a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: "Terminated. Billing stops at the first terminate attempt (billing_stopped_at). If the upstream release fails, upstream_cleanup.status is retry_scheduled and NexaLayer retries in the background."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{session_id}/rotate:
    post:
      summary: Rotate a session proxy and record the reason.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: query
          name: include_credentials
          description: Set true to include rotated proxy credentials. Defaults to false.
          schema: { type: boolean, default: false }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [manual, scheduled, http_403, http_429, captcha, timeout, block]
      responses:
        "200":
          description: Rotated session.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sessions/{session_id}/usage:
    get:
      summary: Get live traffic and locally reported request usage for a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session usage.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{session_id}/renew:
    post:
      summary: Renew a static session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Renewed session.
  /sessions/{session_id}/report-event:
    post:
      summary: Report execution telemetry for a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEvent"
      responses:
        "200":
          description: Event recorded.
  /sessions/{session_id}/health:
    get:
      summary: Get session health metrics and rotation recommendation.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Health metrics.
  /billing/balance:
    get:
      summary: Get account balance.
      responses:
        "200":
          description: Balance.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /billing/recharge:
    post:
      summary: Create a recharge order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [amount]
                - required: [amount_usd]
              properties:
                amount: { type: number, minimum: 10 }
                amount_usd: { type: number, minimum: 10 }
                currency: { type: string, enum: [USDT], default: USDT }
      responses:
        "201":
          description: Recharge order created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeResponse"
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /billing/transactions:
    get:
      summary: List billing transactions.
      responses:
        "200":
          description: Transaction list.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /public/status:
    get:
      security: []
      summary: "Public service status (Statuspage vocabulary): components, active incidents, and incident history. No API key."
      tags: [Support]
      responses:
        "200":
          description: "Current status. Cache-Control: max-age=30."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PublicStatus" }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
  /public/known-issues:
    get:
      security: []
      summary: "Known issues with machine-runnable workaround steps. No API key."
      tags: [Support]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, investigating, identified, monitoring, workaround_available, resolved]
        - { in: query, name: error_code, schema: { type: string } }
        - { in: query, name: component, schema: { type: string } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: id, schema: { type: string } }
      responses:
        "200":
          description: "Known issues."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/KnownIssue" } }
                      total: { type: integer }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
  /public/errors:
    get:
      security: []
      summary: "Error catalog: every error code with retryable, suggested_action, side_effects, and agent/owner steps. No API key."
      tags: [Support]
      responses:
        "200":
          description: "Error catalog and the self-serve procedure."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ErrorCatalogEntry" } }
                      self_serve_procedure: { type: string }
                      total: { type: integer }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
  /public/errors/{code}:
    get:
      security: []
      summary: "One error catalog entry (the target of error.doc_url). No API key."
      tags: [Support]
      parameters: [{ in: path, name: code, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "Catalog entry."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/ErrorCatalogEntry" }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/sla:
    get:
      security: []
      summary: "Early-access support response TARGETS (not guarantees): S1 4h, S2 24h, S3 3 business days, S4 best effort. No API key."
      tags: [Support]
      responses:
        "200":
          description: "Response targets, billing policy, and contact."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { type: object, additionalProperties: true }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
  /public/support/ticket-states:
    get:
      security: []
      summary: "Ticket state machine (8 states including awaiting_approval) and allowed transitions. No API key."
      tags: [Support]
      responses:
        "200":
          description: "States and transitions."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { type: object, additionalProperties: true }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
  /support/tickets:
    post:
      summary: "File a support ticket. Scoped to the API key's account; server assigns severity S1-S4. Recent failed request_ids and error codes on this account are attached automatically; foreign request_ids are dropped. Credentials and full_url are redacted and never stored. Limit 5/hour and 20/day per key."
      tags: [Support]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateTicketRequest" } } }
      responses:
        "201":
          description: "Ticket created."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SupportTicket" }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "200":
          description: "Duplicate or idempotent repeat; returns the existing ticket with deduplicated=true."
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SupportTicket" }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      summary: "List this account's tickets (most recent 50)."
      tags: [Support]
      parameters:
        - in: query
          name: status
          schema: { type: string, description: "open, or a ticket state" }
      responses:
        "200":
          description: Tickets.
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties: { items: { type: array, items: { $ref: "#/components/schemas/SupportTicket" } } }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /support/tickets/{ticket_id}:
    get:
      summary: "Read one ticket: status, severity, events, matched known issue, resolution. Poll no sooner than next_check_after_seconds."
      tags: [Support]
      parameters: [{ in: path, name: ticket_id, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Ticket.
          content:
            "application/json":
              schema:
                type: object
                required: [success, data, error, meta]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/SupportTicket" }
                  error: { nullable: true }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 64 }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: API key is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The requested route, product, or session was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InsufficientBalance:
      description: Account balance is insufficient for the requested operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Product state or idempotency key conflicts with the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Request or trial limit exceeded.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: The request is valid but cannot be fulfilled in the current product or budget state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTH_INVALID_KEY
            - AUTH_EXPIRED_TOKEN
            - AUTH_INSUFFICIENT_PERMISSION
            - ACCOUNT_DISABLED
            - INVALID_REQUEST
            - ROUTE_NOT_FOUND
            - INSUFFICIENT_BALANCE
            - BUDGET_EXCEEDED
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMIT_EXCEEDED
            - TRIAL_NOT_ELIGIBLE
            - PRODUCT_NOT_FOUND
            - PRODUCT_OUT_OF_STOCK
            - SESSION_NOT_FOUND
            - SESSION_EXPIRED
            - SESSION_LIMIT_REACHED
            - BACKEND_ERROR
            - BACKEND_TIMEOUT
            - INTERNAL_ERROR
            - PRICE_MISMATCH
            - INVALID_REFERRAL_CODE
            - REFERRAL_CODE_NOT_FOUND
            - UPSTREAM_UNAVAILABLE
            - TICKET_NOT_FOUND
            - ERROR_CODE_NOT_FOUND
            - INVALID_STATE_TRANSITION
        message: { type: string }
        details: { type: object, additionalProperties: true }
        status: { type: integer, description: "Equals the HTTP status." }
        category:
          type: string
          enum: [invalid_request, auth, payment, conflict, not_found, rate_limit, upstream, internal]
        retryable:
          type: boolean
          description: "Whether the same request is safe to repeat (same Idempotency-Key for paid writes)."
        retry_after: { type: integer, nullable: true, description: "Seconds; mirrors the Retry-After header." }
        suggested_action:
          type: string
          enum:
            - retry_with_backoff
            - wait_and_retry
            - refresh_quote_and_retry
            - fix_request
            - use_socks5
            - add_project_id
            - ask_owner_to_top_up
            - ask_owner_to_raise_budget
            - rotate_session
            - recreate_session
            - check_status
            - report_issue
            - do_not_retry
        side_effects:
          type: object
          properties:
            charged: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
            order_created: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
            session_state_changed: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
        doc_url:
          type: string
          format: uri
          description: "JSON catalog entry at /v1/public/errors/{code}."
        known_issue_id: { type: string, nullable: true }
        request_id: { type: string }
        support:
          type: object
          properties: { email: { type: string }, telegram: { type: string }, ticket_api: { type: string } }
        error_schema_version: { type: string, enum: ["1"] }
      description: "Additive, backward-compatible error envelope (error_schema_version 1). Agents branch on code, retryable, suggested_action and side_effects; message is for humans."
    ErrorResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { type: boolean, enum: [false] }
        data: { nullable: true }
        error: { $ref: "#/components/schemas/Error" }
        meta:
          type: object
          required: [request_id, timestamp]
          properties:
            request_id: { type: string }
            timestamp: { type: string, format: date-time }
            latency_ms: { type: integer }
    ProductListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Product" }
            next_cursor: { type: string, nullable: true }
            total: { type: integer }
            cache_ttl_seconds: { type: integer, maximum: 60 }
            pricing_owner_agent_id: { type: integer, enum: [1474] }
    Product:
      type: object
      required: [product_no, name, type, sharing, available, price, currency, unit]
      properties:
        product_no: { type: string }
        name: { type: string, description: English product name }
        type: { type: string, enum: [dynamic, static] }
        sharing: { type: string, enum: [exclusive, shared] }
        available: { type: boolean }
        price: { type: number }
        currency: { type: string, enum: [USD] }
        unit: { type: string }
        stock: { type: integer }
        country: { type: string }
        city: { type: string }
    RechargeResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            order_id: { type: string }
            amount_usd: { type: number }
            amount_usdt: { type: number }
            amount_cny: { type: number }
            exchange_rate: { type: number }
            network: { type: string, example: TRC20 }
            wallet_address: { type: string }
            wallet_explorer_url: { type: string, format: uri }
            status: { type: string }
    RequestApiKeyResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            status:
              type: string
              enum: [email_sent, email_recently_sent]
            balance: { type: number, example: 0 }
            backend_ready: { type: boolean }
            message: { type: string }
            trial:
              type: object
              properties:
                granted: { type: boolean }
                amount_usd: { type: number }
                expires_at: { type: string, format: date-time }
    RegisterResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            agent_id: { type: integer }
            api_key: { type: string }
            api_secret: { type: string }
            backend_ready: { type: boolean }
            backend_sync_error: { type: string }
    CreateSessionRequest:
      type: object
      required: [session_type, product_no]
      properties:
        session_type: { type: string, enum: [dynamic, static] }
        product_no: { type: string }
        provisioning_mode:
          type: string
          enum: [purchase, existing]
          default: purchase
          description: Use existing for a resource already configured on the backend account; no NexaLayer purchase or charge is made.
        resource_id:
          type: string
          description: Optional existing static order number. If omitted, NexaLayer selects a usable static resource on the account.
        quantity: { type: number, exclusiveMinimum: 0, default: 1 }
        duration: { type: integer, minimum: 1 }
        protocol: { type: string, enum: [socks5, http, https], default: socks5 }
        country_code: { type: string }
        city_code: { type: string }
        project_id:
          type: string
          description: Static shared proxy project code. Required by some shared static products.
        rotation_mode: { type: string, enum: [fixed, timed, on_demand] }
        rotation_interval_sec: { type: integer }
    UpdateBudgetRequest:
      type: object
      properties:
        key_limit_usd: { type: number, minimum: 0, nullable: true }
        daily_limit_usd: { type: number, minimum: 0, nullable: true }
        pause_on_exceed:
          type: boolean
          default: false
          deprecated: true
          description: Retained for compatibility; exceeding a budget never pauses the key automatically.
        alert_thresholds:
          type: array
          items: { type: integer, minimum: 1, maximum: 100 }
        paused: { type: boolean }
    SessionResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            session_id: { type: string }
            session_type: { type: string }
            status: { type: string }
            provisioning_mode: { type: string, enum: [purchase, existing] }
            proxy:
              type: object
              properties:
                host: { type: string }
                port: { type: integer }
                username: { type: string }
                password: { type: string }
                protocol: { type: string }
                full_url:
                  type: string
                  nullable: true
                  example: socks5://user:pass@proxy.example.com:1080
            health:
              type: object
              properties:
                risk_level: { type: string, enum: [low, medium, high] }
                health_score: { type: integer }
                success_rate: { type: number }
                consecutive_failures: { type: integer }
    TelemetryEvent:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
          enum: [success, http_error, captcha, timeout, block, rate_limit, custom]
        status_code: { type: integer }
        target_host: { type: string }
        latency_ms: { type: integer }
        error_message: { type: string }
        bytes_used: { type: integer, minimum: 0 }
        metadata: { type: object }
    Meta:
      type: object
      properties:
        request_id: { type: string, example: req_be9b2b51868b4147 }
        timestamp: { type: string, format: date-time }
        latency_ms: { type: integer }
    ErrorCatalogEntry:
      type: object
      properties:
        code: { type: string }
        status: { type: integer }
        category:
          type: string
          enum: [invalid_request, auth, payment, conflict, not_found, rate_limit, upstream, internal]
        retryable: { type: boolean }
        retry_after: { type: integer, nullable: true }
        suggested_action:
          type: string
          enum:
            - retry_with_backoff
            - wait_and_retry
            - refresh_quote_and_retry
            - fix_request
            - use_socks5
            - add_project_id
            - ask_owner_to_top_up
            - ask_owner_to_raise_budget
            - rotate_session
            - recreate_session
            - check_status
            - report_issue
            - do_not_retry
        side_effects:
          type: object
          properties:
            charged: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
            order_created: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
            session_state_changed: { oneOf: [{ type: boolean }, { type: string, enum: [unknown] }] }
        description: { type: string }
        agent_steps: { type: array, items: { type: string } }
        owner_steps: { type: array, items: { type: string } }
        doc_url: { type: string, format: uri }
    PublicStatus:
      type: object
      properties:
        indicator: { type: string, enum: [none, minor, major, critical] }
        updated_at: { type: string, format: date-time }
        components:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [api, sessions, billing, catalog, upstream_network] }
              name: { type: string }
              status:
                type: string
                enum: [operational, degraded_performance, partial_outage, major_outage, under_maintenance]
              source: { type: string, enum: [auto, admin] }
              reason: { type: string, nullable: true }
              updated_at: { type: string, format: date-time, nullable: true }
        active_incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        incident_history: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        scheduled_maintenance: { type: array, items: { type: object } }
    Incident:
      type: object
      properties:
        id: { type: string }
        component: { type: string }
        status: { type: string, enum: [investigating, identified, monitoring, resolved] }
        impact: { type: string }
        source: { type: string }
        reason: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        updates: { type: array, items: { type: object } }
    KnownIssue:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        severity: { type: string, enum: [S1, S2, S3, S4] }
        components: { type: array, items: { type: string } }
        error_codes: { type: array, items: { type: string } }
        workaround:
          type: object
          nullable: true
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  action: { type: string, enum: [wait, call, set_param, ask_owner, report_issue, upgrade] }
                additionalProperties: true
            billing_note: { type: string }
        fixed_in: { type: object, nullable: true }
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [category, summary]
      properties:
        category:
          type: string
          enum:
            - usage_question
            - bug
            - outage
            - billing
            - refund_request
            - feature_request
            - sales_pricing
            - abuse_report
            - security
        severity_claimed: { type: string, enum: [S1, S2, S3, S4] }
        summary: { type: string, maxLength: 200 }
        request_ids: { type: array, maxItems: 20, items: { type: string, pattern: "^req_[A-Za-z0-9]+$" } }
        session_id: { type: string }
        error_codes: { type: array, maxItems: 10, items: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" } }
        occurred_at: { type: string, format: date-time }
        known_issue_id: { type: string }
        reproduction:
          type: object
          additionalProperties: false
          properties:
            method: { type: string, enum: [GET, POST, PUT, DELETE, PATCH, MCP] }
            endpoint_or_tool: { type: string }
            params_redacted: { type: object }
            expected: { type: string, maxLength: 1000 }
            actual: { type: string, maxLength: 1000 }
            attempts: { type: integer, minimum: 1 }
        client:
          type: object
          additionalProperties: false
          properties:
            agent_name: { type: string }
            agent_version: { type: string }
            via: { type: string, enum: [rest, mcp, python_sdk, other] }
            sdk_or_mcp_version: { type: string }
            mcp_client: { type: string }
        desired_outcome: { type: string, enum: [fix, workaround, refund_review, explanation, feature] }
        notify:
          type: object
          additionalProperties: false
          properties: { owner_email_cc: { type: boolean } }
        idempotency_key: { type: string, maxLength: 64, description: "Alternative to the Idempotency-Key header." }
    SupportTicket:
      type: object
      properties:
        ticket_id: { type: string, example: tkt_mvdt5su3b51f57f3d2 }
        status:
          type: string
          enum:
            - received
            - triaged
            - needs_info
            - in_progress
            - awaiting_approval
            - workaround_available
            - resolved
            - closed
        severity: { type: string, enum: [S1, S2, S3, S4] }
        category: { type: string }
        triage_class: { type: string }
        assignee_role: { type: string, enum: [product_bot, founder, sales_bot] }
        route: { type: string }
        summary: { type: string }
        session_id: { type: string, nullable: true }
        request_ids: { type: array, items: { type: string } }
        error_codes: { type: array, items: { type: string } }
        auto_attached_error_codes: { type: array, items: { type: string } }
        deduplicated: { type: boolean }
        duplicate_count: { type: integer }
        redactions_applied: { type: integer }
        matched_known_issue: { type: object, nullable: true }
        response_target:
          type: object
          properties:
            first_response_by: { type: string, format: date-time, nullable: true }
            kind: { type: string, enum: [early_access_target_not_guarantee] }
        next_check_after_seconds: { type: integer }
        resolution: { type: object, nullable: true }
        events:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              from: { type: string, nullable: true }
              to: { type: string }
              actor: { type: string }
              reason: { type: string }
        human_contact: { type: object }
        links: { type: object }
tags:
  - name: Support
    description: "Machine-readable support for agents: status, known issues, error catalog, SLA targets, and tickets. Human contact: support@nexalayer.net (Telegram @LEWISMIN)."
