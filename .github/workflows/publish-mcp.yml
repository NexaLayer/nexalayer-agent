name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate credentials and package without publishing
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: mcp
      - run: npm run check
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
      - name: Build and validate Smithery MCPB bundle
        run: npm run mcpb:build
        working-directory: mcp
      - name: Upload MCPB bundle artifact
        uses: actions/upload-artifact@v5
        with:
          name: nexalayer-mcpb
          path: mcp/nexalayer-*.mcpb
      - name: Verify npm credentials
        run: npm whoami
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry-run npm package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish npm package
        if: github.event_name == 'release' || !inputs.dry_run
        run: npm publish --access public --provenance
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public scoped npm package
        if: github.event_name == 'release' || !inputs.dry_run
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            [ "$(npm view @nexalayer/mcp version --prefer-online)" = "$VERSION" ] && exit 0
            sleep 15
          done
          exit 1
        working-directory: mcp
      - name: Install MCP publisher
        working-directory: mcp
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate registry metadata
        working-directory: mcp
        run: ./mcp-publisher validate server.json
      - name: Publish to the official MCP Registry
        if: github.event_name == 'release' || !inputs.dry_run
        working-directory: mcp
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
      - name: Verify MCP Registry authentication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: mcp
        run: ./mcp-publisher login github-oidc
      - name: Explain MCP dry-run boundary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "mcp-publisher has no publish dry-run; validate and OIDC login are the final non-mutating checks."
